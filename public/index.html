<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F6FA">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WindTower">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WindTower</title>
<style>
/* ===== 配色：灰白底 · 海军蓝主色 · 浅蓝点缀 · 少量红色强调 ===== */
:root{
  --bg:#F4F6FA;        /* 页面底色：很浅的灰蓝 */
  --card:#FFFFFF;      /* 卡片：白 */
  --line:#E3E8F0;      /* 边框：浅灰 */
  --ink:#1B2B44;       /* 主文字：深蓝灰 */
  --mute:#6B7890;      /* 次要文字：灰 */
  --acc:#1F4E8C;       /* 主色：海军蓝（按钮、正确答案） */
  --acc-soft:#E8EEF7;  /* 浅蓝：标签、选中、格子 */
  --acc-ink:#24497A;   /* 浅蓝上的文字 */
  --red:#C8373B;       /* 强调红：标题竖线、倒计时警告 */
  --warn:var(--red);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(32px + env(safe-area-inset-bottom));padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}

/* 顶部 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px;color:var(--acc)}
.brand svg{flex:0 0 auto}
.langs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.langs button{padding:6px 10px;font-size:13px;font-weight:500;background:transparent;color:var(--mute);border-radius:7px}
.langs button.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:9px 6px;font-size:14px;font-weight:500;background:transparent;color:var(--mute);border-radius:7px}
.seg button.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:0 1px 3px rgba(27,43,68,.12)}
.seg button:disabled{opacity:1;cursor:default}
h1{font-size:22px;line-height:1.3;margin:0 0 8px;font-weight:700}
.sub{color:var(--mute);font-size:14.5px;margin-bottom:26px;line-height:1.6}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(27,43,68,.04)}
.card>b{display:block;font-size:15px;font-weight:600;color:var(--acc-ink);background:var(--acc-soft);border-left:3px solid var(--red);border-radius:0 8px 8px 0;padding:8px 12px;margin:0 0 14px}

/* 按钮 / 输入框 */
button{font:inherit;border:1px solid transparent;border-radius:10px;padding:13px 18px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s}
button:active{opacity:.85}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.stack>*+*{margin-top:10px}
.hide{display:none!important}
.mute{color:var(--mute);font-size:14px;line-height:1.6}
.label{color:var(--mute);font-size:13px;margin-bottom:8px}

/* 答题 */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc-ink)}
.q{font-size:18px;line-height:1.6;margin:16px 0 20px;font-weight:500}
.unit{flex:0 0 auto!important;min-width:36px;color:var(--mute);font-size:14px}
.timer{height:4px;background:#EDF1F6;border-radius:4px;overflow:hidden;margin-top:16px}
.timer>div{height:100%;background:var(--acc);width:100%;transition:width .2s linear}
.scene{position:relative;height:250px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#E9EFF8 0%,#F7F9FC 100%);border:1px solid var(--line);margin-bottom:16px}
.scene svg{position:absolute;inset:0;width:100%;height:100%}

/* 结果 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .mute{font-size:12px;line-height:1.3}
.big{font-size:26px;font-weight:700;line-height:1.25}
.stat .big{font-size:19px;margin-top:6px;overflow-wrap:anywhere}
.ex{font-size:14.5px;line-height:1.65;color:#3A4A63;margin:16px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.board div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1F5;font-size:15px}
.board div:last-child{border-bottom:0}
.board span:last-child{color:var(--mute);white-space:nowrap}
#rAll:not(:empty){margin-top:12px}

/* 结算 */
.farm{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:18px;padding-bottom:1px;border-bottom:1px solid var(--line)}
.farm div{flex:1;background:linear-gradient(180deg,#5E83B8,#B9CBE4);border-radius:3px 3px 0 0;min-height:2px}

/* 等级 */
.lvl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12.5px;text-align:center;margin:4px 0 18px}
.lvl div{background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:10px 6px;overflow-wrap:anywhere;color:var(--mute)}
.lvl b{display:block;color:var(--acc);font-size:14px;margin-top:2px}
@media(max-width:480px){.lvl{grid-template-columns:repeat(2,minmax(0,1fr))}}

.toast{pointer-events:none;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:9;transition:opacity .3s;box-shadow:0 6px 20px rgba(27,43,68,.18);max-width:90vw}
@keyframes spin{to{transform:rotate(360deg)}}
.rotor{animation:spin 3s linear infinite}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#1F4E8C"/><path d="M12.3 24 L13.7 24 L13.35 11.5 L12.65 11.5Z" fill="#fff"/><g fill="#fff"><path d="M13 11 L12.2 3.5 L13 2.5 L13.8 3.5Z"/><path d="M13 11 L19.6 14.6 L19.9 15.8 L18.7 15.6Z" /><path d="M13 11 L6.4 14.6 L6.1 15.8 L7.3 15.6Z"/></g><circle cx="13" cy="11" r="1.5" fill="#C8373B"/></svg>WindTower</div><div class="langs" id="langs"></div></div>
  <h1 id="headline"></h1>
  <div class="sub" data-t="subtitle"></div>

  <section id="home">
    <div class="card hide" id="installCard">
      <b data-t="installTitle"></b>
      <div class="mute" id="installTip"></div>
      <div class="row" style="margin-top:16px"><button id="installBtn" class="hide" data-t="install"></button><button class="ghost" id="installClose" data-t="gotIt"></button></div>
    </div>
    <div class="card">
      <div class="label" data-t="nickname"></div>
      <input id="nick" maxlength="16" data-tp="nickPh">
    </div>
    <div class="card">
      <b data-t="soloTitle"></b>
      <div class="mute" style="margin-bottom:16px" data-t="soloDesc"></div>
      <div class="lvl" id="lvlShow"></div>
      <div class="row"><button id="soloBtn" data-t="soloStart"></button><button class="ghost" id="resetLvl" data-t="resetLvl"></button></div>
    </div>
    <div class="card" id="multiCard">
      <b data-t="multiTitle"></b>
      <div class="mute" style="margin-bottom:16px" data-t="multiDesc"></div>
      <div class="row"><button id="createBtn" data-t="createRoom"></button></div>
      <div class="row" style="margin-top:10px"><input id="codeIn" data-tp="codePh" maxlength="6" style="text-transform:uppercase"><button class="ghost" id="joinBtn" data-t="join"></button></div>
      <div class="mute" id="netMsg" style="margin-top:10px"></div>
    </div>
    <div class="card hide" id="demoNote">
      <b data-t="multiTitle"></b>
      <div class="mute" data-t="demoNote"></div>
    </div>
  </section>

  <section id="lobby" class="hide">
    <div class="card">
      <div class="label" data-t="roomCode"></div>
      <div class="big" id="roomCode" style="letter-spacing:3px;color:var(--acc)"></div>
      <div class="row" style="margin-top:14px"><input id="shareLink" readonly><button class="ghost" id="copyBtn" style="flex:0 0 auto" data-t="copyLink"></button></div>
      <div class="label" style="margin-top:22px" data-t="diffLabel"></div>
      <div class="seg" id="diffSeg"></div>
      <div class="mute" id="diffHint" style="margin-top:8px;font-size:13px"></div>
      <div class="label" style="margin-top:22px" data-t="players"></div>
      <div class="board" id="lobbyList"></div>
      <div class="row" style="margin-top:18px"><button id="startBtn" data-t="startMatch"></button><button class="ghost" id="leaveBtn" data-t="leave"></button></div>
      <div class="mute" id="lobbyMsg" style="margin-top:12px"></div>
    </div>
  </section>

  <section id="game" class="hide">
    <div class="card">
      <div class="pills"><span class="pill" id="qNum"></span><span class="pill" id="qCat"></span><span class="pill" id="qLvl"></span></div>
      <div class="q" id="qText"></div>
      <form id="ansForm" class="row" autocomplete="off">
        <input id="ans" inputmode="decimal" data-tp="ansPh">
        <div id="unit" class="unit"></div>
        <button style="flex:0 0 auto" data-t="ok"></button>
      </form>
      <div class="timer"><div id="bar"></div></div>
      <div class="mute" id="waitMsg" style="margin-top:10px"></div>
    </div>
    <div class="scene" id="scene"></div>
    <div class="card hide" id="result">
      <div class="stats"><div class="stat"><div class="mute" data-t="yourAns"></div><div class="big" id="rYou"></div></div><div class="stat"><div class="mute" data-t="rightAns"></div><div class="big" id="rAns" style="color:var(--acc)"></div></div><div class="stat"><div class="mute" data-t="towerH"></div><div class="big" id="rH"></div></div></div>
      <div class="ex" id="rEx"></div>
      <div class="board" id="rAll"></div>
      <button id="nextBtn" style="width:100%;margin-top:20px"></button>
      <div class="mute" id="nextMsg" style="margin-top:10px;text-align:center"></div>
    </div>
    <div class="card hide" id="liveBoard"><b data-t="liveRank"></b><div class="board" id="liveList"></div></div>
  </section>

  <section id="end" class="hide">
    <div class="card">
      <div class="label" data-t="farmTotal"></div>
      <div class="big" id="endTotal"></div>
      <div class="mute" id="endAvg" style="margin-top:6px"></div>
      <div class="farm" id="farm"></div>
      <div class="mute" style="margin-top:10px;font-size:12.5px" data-t="farmNote"></div>
    </div>
    <div class="card hide" id="endBoardCard"><b data-t="finalRank"></b><div class="board" id="endBoard"></div></div>
    <div class="row"><button id="againBtn" data-t="again"></button><button class="ghost" id="homeBtn" data-t="home"></button></div>
  </section>
</div>
<div class="toast" id="toast" style="opacity:0"></div>

};
const LANGS=Object.keys(I18N);
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function detectLang(){const saved=store("wt_lang");if(LANGS.includes(saved))return saved;
  for(const l of (navigator.languages||[navigator.language||"en"])){const s=String(l).slice(0,2).toLowerCase();if(LANGS.includes(s))return s}return "en"}
let LANG=detectLang();
// t("key",{n:1}) → 当前语言的文字；L(obj) → 从 {zh,en,de,es} 里取当前语言
const t=(k,v)=>{let s=(I18N[LANG][k]??I18N.en[k]??k);if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s};
const L=o=>o&&typeof o==="object"?(o[LANG]??o.en??o.zh??""):(o??"");
const CATS=["policy","oem","dev","fin"];const catName=c=>t("cat_"+c);

// 每局题数：单人 8 题；对战题数由服务器决定（默认 15 题）
const SOLO_N=8,TIME=25;
let N=SOLO_N;
// 网站所在的路径（例如公司服务器上可能是 /windtower/），所有地址都相对它计算
const BASE=location.pathname.replace(/[^/]*$/,"");
const $=id=>document.getElementById(id);
// 切换页面；大标题和说明只在首页显示，答题时界面更清爽
const show=id=>{["home","lobby","game","end"].forEach(s=>$(s).classList.toggle("hide",s!==id));$("headline").classList.toggle("hide",id!=="home");document.querySelector(".sub").classList.toggle("hide",id!=="home");window.scrollTo(0,0)};
function toast(s){const e=$("toast");e.textContent=s;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1800)}
const fmt=n=>(Math.round(n*100)/100).toLocaleString(I18N[LANG]._locale);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const withUnit=(n,u)=>u?fmt(n)+" "+u:fmt(n);
function heightFor(q,g){if(g===null||isNaN(g))return 0;const d=Math.min(1,Math.abs(g-q.a)/q.r);return Math.round(199*Math.pow(1-d,2))}
function parseAns(){const raw=$("ans").value.replace(/\s/g,"").replace(",",".");if(raw==="")return null;const g=parseFloat(raw);return isNaN(g)?null:g}

// ---------- 语言切换：重绘所有界面文字和当前题目 ----------
let curQ=null,curResult=null; // 记住当前显示的题目/结果，切换语言时重绘
function applyLang(){
  document.documentElement.lang=LANG;document.title=t("title");
  // 标题里 "WindTower · " 已经显示在左上角，这里只显示后半句
  $("headline").textContent=t("title").split(" · ").slice(1).join(" · ")||t("title");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-tp]").forEach(e=>e.placeholder=t(e.dataset.tp));
  $("langs").innerHTML=LANGS.map(l=>`<button class="${l===LANG?"on":""}" data-lang="${l}">${I18N[l]._name}</button>`).join("");
  renderLvl();renderInstallTip();
  if(curQ)fillQuestion(curQ.q,curQ.idx);
  if(curResult)fillResult(...curResult);
  $("nextBtn").textContent=t(nextIsLast?"seeResult":"next");
  if(M.state)renderBoards(M.state);
  if(lastEnd)showEnd(...lastEnd);
  if(netKey)$("netMsg").textContent=t(...netKey);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;LANG=b.dataset.lang;store("wt_lang",LANG);applyLang()});

// ---------- 风机画面 ----------
function drawScene(h,animate,emptyText){
  const W=360,H=260,ground=235,top=20,scale=(ground-top)/199;
  const ticks=[50,100,150,199].map(m=>{const y=ground-m*scale;return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#D3DCE8" stroke-dasharray="2 6"/><text x="6" y="${y-3}" font-size="10" fill="#97A3B6">${m} m</text>`}).join("");
  const hubY=ground-h*scale,bl=Math.max(8,h*scale*0.42),cx=W/2;
  $("scene").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax meet">${ticks}
  <rect x="0" y="${ground}" width="${W}" height="${H-ground}" fill="#DCE4EF"/>
  <g id="tw" style="transition:transform 1.2s cubic-bezier(.2,.8,.2,1);transform-origin:${cx}px ${ground}px;transform:scaleY(${animate?0.001:1})">
    <polygon points="${cx-6},${ground} ${cx+6},${ground} ${cx+3},${hubY} ${cx-3},${hubY}" fill="#FFFFFF" stroke="#AFBCCD"/></g>
  ${h>0?`<g id="rt" style="opacity:${animate?0:1};transition:opacity .4s 1.1s"><rect x="${cx-4}" y="${hubY-5}" width="16" height="9" rx="3" fill="#F1F4F8" stroke="#AFBCCD"/>
   <g class="rotor" style="transform-origin:${cx}px ${hubY}px">${[0,120,240].map(a=>`<path d="M${cx} ${hubY} L${cx-3} ${hubY-bl*0.3} L${cx} ${hubY-bl} L${cx+2} ${hubY-bl*0.3} Z" fill="#FFFFFF" stroke="#AFBCCD" transform="rotate(${a} ${cx} ${hubY})"/>`).join("")}<circle cx="${cx}" cy="${hubY}" r="3" fill="#C8373B"/></g></g>
   <text x="${cx+18}" y="${hubY+4}" font-size="15" font-weight="700" fill="#1F4E8C">${h} m</text>`:`<text x="${cx}" y="${ground-10}" text-anchor="middle" font-size="13" fill="#6B7890">${esc(emptyText||t("hint"))}</text>`}</svg>`;
  if(animate)requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=$("tw");if(a)a.style.transform="scaleY(1)";const r=$("rt");if(r)r.style.opacity=1}));
}
let timerId=null,nextIsLast=false,lastEnd=null;
function runTimer(deadline,onEnd){clearInterval(timerId);timerId=setInterval(()=>{const left=(deadline-Date.now())/1000;$("bar").style.width=Math.max(0,left/TIME*100)+"%";$("bar").style.background=left<6?"var(--warn)":"var(--acc)";if(left<=0){clearInterval(timerId);onEnd&&onEnd()}},200)}
function fillQuestion(q,idx){
  $("qNum").textContent=t("qNum",{n:idx+1,t:N});$("qCat").textContent=catName(q.c);$("qLvl").textContent="Lv "+q.l;
  $("qText").textContent=L(q.q);$("unit").textContent=L(q.u);
}
function showQuestion(q,idx){
  curQ={q,idx};curResult=null;lastEnd=null;fillQuestion(q,idx);
  $("ans").value="";$("ans").disabled=false;$("ansForm").querySelector("button").disabled=false;
  $("result").classList.add("hide");$("waitMsg").textContent="";
  // 作答期间不显示风机塔，答完后才和正确答案一起出现
  $("scene").classList.add("hide");setTimeout(()=>$("ans").focus(),50);
}
function lockInput(){$("ans").disabled=true;$("ansForm").querySelector("button").disabled=true}
function fillResult(g,a,u,ex,h,timedOut){
  $("rYou").textContent=g===null?(timedOut?t("timeout"):"—"):fmt(g);$("rAns").textContent=withUnit(a,L(u));$("rH").textContent=h+" "+t("m");$("rEx").textContent=L(ex);
}
function showResult(g,a,u,ex,h,timedOut){
  curResult=[g,a,u,ex,h,timedOut];fillResult(g,a,u,ex,h,timedOut);
  $("scene").classList.remove("hide");$("result").classList.remove("hide");drawScene(h,true,t("tooFar"));
  $("scene").scrollIntoView({behavior:"smooth",block:"start"});
}
function showEnd(heights,players){
  lastEnd=[heights,players];curQ=null;curResult=null;
  const tot=heights.reduce((a,b)=>a+(b||0),0),loc=I18N[LANG]._locale;
  $("endTotal").textContent=tot.toLocaleString(loc)+" / "+(199*N).toLocaleString(loc)+" "+t("m");
  $("endAvg").textContent=t("avg",{n:Math.round(tot/N)})+(mode==="solo"?" · "+t("levels")+CATS.map(c=>catName(c)+" Lv"+levels[c]).join(", "):"");
  $("farm").innerHTML=Array.from({length:N},(_,i)=>`<div style="height:${(heights[i]||0)/199*100}%"></div>`).join("");
  $("endBoardCard").classList.toggle("hide",!players);
  if(players)$("endBoard").innerHTML=players.map((p,i)=>`<div><span>${["🥇","🥈","🥉"][i]||i+1+"."} ${esc(p.name)}${p.id===pid?t("you"):""}</span><span>${p.total.toLocaleString(loc)} ${t("m")}</span></div>`).join("");
  show("end");
}

// ---------- 昵称 & 等级 ----------
$("nick").value=store("wt_nick")||"";
const nick=()=>{const n=$("nick").value.trim()||"Player";store("wt_nick",n);return n};
let levels=store("wt_levels")||{policy:1,oem:1,dev:1,fin:1};
function renderLvl(){$("lvlShow").innerHTML=CATS.map(c=>`<div>${catName(c)}<b>Lv ${levels[c]}</b></div>`).join("")}
$("resetLvl").onclick=()=>{levels={policy:1,oem:1,dev:1,fin:1};store("wt_levels",levels);store("wt_streak",null);renderLvl();toast(t("lvlReset"))};

// ---------- 单人模式（在浏览器里判分） ----------
let mode=null,BANK=null,S=null;
async function startSolo(){
  mode="solo";nick();
  if(!BANK){try{BANK=await (await fetch("api/questions")).json()}catch(e){toast(t("loadFail"));return}}
  N=SOLO_N;
  // 升级进度（连续答好的次数）跨局保存：单人每局每类只有 2 题，这样升级不会被"新开一局"打断
  S={i:0,heights:[],used:new Set(),streak:Object.assign({policy:0,oem:0,dev:0,fin:0},store("wt_streak")||{})};
  $("liveBoard").classList.add("hide");show("game");soloNext();
}
function soloPick(){const c=CATS[S.i%4];
  for(const dl of [0,-1,1,-2,2]){const pool=BANK.filter(q=>q.c===c&&q.l===levels[c]+dl&&!S.used.has(q));if(pool.length)return pool[Math.floor(Math.random()*pool.length)]}
  const rest=BANK.filter(q=>!S.used.has(q));return rest[Math.floor(Math.random()*rest.length)]}
function soloNext(){
  if(S.i>=N)return showEnd(S.heights,null);
  const q=soloPick();S.used.add(q);S.cur=q;showQuestion(q,S.i);
  $("nextBtn").classList.remove("hide");$("nextMsg").textContent="";$("rAll").innerHTML="";
  runTimer(Date.now()+TIME*1000,()=>soloSubmit(true));
}
function soloSubmit(timedOut){
  if($("ans").disabled)return;clearInterval(timerId);lockInput();
  const g=parseAns(),q=S.cur,h=heightFor(q,g);S.heights.push(h);S.i++;
  showResult(g,q.a,q.u,q.ex,h,timedOut===true);nextIsLast=S.i>=N;$("nextBtn").textContent=t(nextIsLast?"seeResult":"next");
  if(h>=150){S.streak[q.c]++;if(S.streak[q.c]>=2&&levels[q.c]<3){levels[q.c]++;S.streak[q.c]=0;store("wt_levels",levels);toast(t("lvlUp",{c:catName(q.c),n:levels[q.c]}))}}else S.streak[q.c]=0;
  store("wt_streak",S.streak);
}
$("soloBtn").onclick=startSolo;
$("nextBtn").onclick=()=>{if(mode==="solo")soloNext()};

// ---------- 联机模式（服务器出题、判分） ----------
let pid=store("wt_pid");if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);store("wt_pid",pid)}
let socket=null;const M={code:null,state:null,heights:[]};
let netKey=null; // 记住提示的"代码"，切换语言时重新翻译
const netMsg=(k,v)=>{netKey=k?[k,v]:null;$("netMsg").textContent=k?t(k,v):""};
function connect(){
  if(socket)return socket;
  if(typeof io==="undefined"){netMsg("noServer");return null}
  socket=io({path:BASE+"socket.io",auth:{pid}});
  socket.on("connect_error",()=>netMsg("connecting"));
  socket.on("err",code=>{netMsg("err_"+code);toast(t("err_"+code))});
  socket.on("joined",({code})=>{mode="multi";M.code=code;M.heights=[];netMsg("");
    history.replaceState(null,"","#"+code);$("roomCode").textContent=code;$("shareLink").value=location.origin+BASE+"#"+code;show("lobby")});
  socket.on("state",st=>{M.state=st;renderBoards(st)});
  socket.on("question",q=>{mode="multi";N=q.total;$("liveBoard").classList.remove("hide");show("game");showQuestion(q,q.index);
    $("nextBtn").classList.add("hide");$("rAll").innerHTML="";runTimer(q.deadline,()=>{if(!$("ans").disabled)multiSubmit()})});
  socket.on("reveal",r=>{clearInterval(timerId);lockInput();
    const me=r.results.find(x=>x.id===pid)||{guess:null,height:0};M.heights[r.index]=me.height;
    showResult(me.guess,r.a,r.u,r.ex,me.height,false);$("waitMsg").textContent="";
    $("rAll").innerHTML=r.results.map((x,i)=>`<div><span>${i+1}. ${esc(x.name)}${x.id===pid?t("you"):""}</span><span>${x.guess===null?"—":fmt(x.guess)} → ${x.height} ${t("m")}</span></div>`).join("");
    $("nextMsg").textContent=r.index+1>=N?t("finalSoon"):t("autoNext",{n:r.seconds})});
  socket.on("end",e=>{const me=e.players.find(p=>p.id===pid);if(me)N=me.heights.length||N;showEnd(me?me.heights:M.heights,e.players)});
  return socket;
}
function renderBoards(st){
  const loc=I18N[LANG]._locale;
  const rows=st.players.map(p=>`<div><span>${p.id===st.hostId?"👑 ":""}${esc(p.name)}${p.id===pid?t("you"):""}${p.online?"":t("offline")}</span><span>${st.phase==="question"?(p.answered?t("answered"):t("thinking")):p.total.toLocaleString(loc)+" "+t("m")}</span></div>`).join("");
  $("lobbyList").innerHTML=rows;$("liveList").innerHTML=rows;
  const host=st.hostId===pid;
  $("startBtn").classList.toggle("hide",!host);
  $("lobbyMsg").textContent=host?t("hostHint"):t("waitHost");
  // 难度：房主可以点选，其他人只能看
  const d=st.difficulty||"standard";
  $("diffSeg").innerHTML=["easy","standard","hard"].map(x=>`<button class="${x===d?"on":""}" data-diff="${x}" ${host?"":"disabled"}>${t("diff_"+x)}</button>`).join("");
  $("diffHint").textContent=t("diffHint_"+d)+(host?"":" · "+t("diffHostOnly"));
}
function multiSubmit(){if($("ans").disabled)return;lockInput();socket.emit("answer",{value:parseAns()});$("waitMsg").textContent=t("submitted")}
$("ansForm").onsubmit=e=>{e.preventDefault();mode==="solo"?soloSubmit(false):multiSubmit()};
$("createBtn").onclick=()=>{const s=connect();if(s){netMsg("creating");s.emit("create",{name:nick()})}};
$("joinBtn").onclick=()=>{const c=$("codeIn").value.trim().toUpperCase();if(c.length<4){netMsg("needCode");return}
  const s=connect();if(s){netMsg("joining");s.emit("join",{code:c,name:nick()})}};
$("startBtn").onclick=()=>socket&&socket.emit("start");
$("diffSeg").addEventListener("click",e=>{const b=e.target.closest("[data-diff]");if(b&&!b.disabled&&socket)socket.emit("difficulty",{value:b.dataset.diff})});
$("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText($("shareLink").value);toast(t("linkCopied"))}catch(e){$("shareLink").select()}};
function goHome(){if(socket){socket.disconnect();socket=null}curQ=null;curResult=null;lastEnd=null;history.replaceState(null,"",BASE);show("home")}
$("leaveBtn").onclick=goHome;
// 对战结束后"再来一局"回到房间：房主可以换难度再开始
$("againBtn").onclick=()=>{if(mode==="solo")startSolo();else{lastEnd=null;show("lobby")}};
$("homeBtn").onclick=goHome;

// ---------- PWA：离线缓存 + 安装提示 ----------
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
let deferredPrompt=null;
function renderInstallTip(){$("installTip").textContent=deferredPrompt?t("installOther"):t("installIOS")}
if(!standalone&&!store("wt_install_hide")){
  if(isIOS)$("installCard").classList.remove("hide");
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;renderInstallTip();$("installBtn").classList.remove("hide");$("installCard").classList.remove("hide")});
}
$("installBtn").onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("installCard").classList.add("hide")};
$("installClose").onclick=()=>{store("wt_install_hide",true);$("installCard").classList.add("hide")};

// ---------- 启动 ----------
// 展示版（GitHub Pages）：没有服务器，只开放单人模式
if(window.STATIC_DEMO){$("multiCard").classList.add("hide");$("demoNote").classList.remove("hide")}
applyLang();drawScene(0,false);
// 通过分享链接打开（网址末尾带 #房间号）：自动填好房间号
const hashCode=location.hash.slice(1).toUpperCase();
if(hashCode&&!window.STATIC_DEMO){$("codeIn").value=hashCode;netMsg("joinPrompt",{c:hashCode})}
</script>
